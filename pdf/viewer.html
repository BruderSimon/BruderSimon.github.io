<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypt</title>
<link rel="stylesheet" href="./../style.css">
<style>
  /* ---- VIEWER ---- */
  #viewer {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  #viewer.visible {
    display: flex;
  }

  .viewer-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .viewer-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .viewer-title .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .lock-btn {
    font-family:  monospace;
    font-size: 0.65rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 0.3rem 0.75rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .lock-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  #pdfEmbed {
    flex: 1;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

<!-- ===== LOCK SCREEN ===== -->
<div id="lockScreen">
  <div class="card">
    <div class="header">
      <div class="tag">Protected content</div>
      <h1>Enter <span style="color: var(--surimiOrange)">PIN</span></h1>
    </div>

    <div class="pin-inputs" id="pinRow">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
    </div>
    <button class="btn" id="unlockBtn" disabled>Decrypt</button>
    <div class="status" id="errorMsg"></div>
    <div class="loading-msg" id="loadingMsg"></div>
  </div>
</div>

<!-- ===== PDF VIEWER ===== -->
<div id="viewer">
  <div class="viewer-bar">
    <div class="viewer-title">
      <span class="dot"></span>
      <span id="viewerFilename">PDF Viewer</span>
    </div>
    <button class="lock-btn" id="lockBtn">Lock</button>
  </div>
  <iframe id="pdfEmbed" title="PDF Viewer" allowfullscreen></iframe>
</div>

<script src="decrypt.js"></script>
</body>
</html>
