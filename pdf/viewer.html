<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypt</title>
<link rel="stylesheet" href="./../style.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #00ff88;
    --accent-dim: rgba(0,255,136,0.08);
    --text: #e8e8e8;
    --muted: #555;
    --danger: #ff4444;
  }

  .unlock-btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .unlock-btn:hover:not(:disabled) {
    background: #00ffaa;
  }

  .unlock-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .error-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--danger);
    margin-top: 0.75rem;
    min-height: 1rem;
    text-align: center;
  }

  .loading-msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.75rem;
    min-height: 1rem;
    text-align: center;
  }

  /* ---- VIEWER ---- */
  #viewer {
    display: none;
    flex-direction: column;
    height: 100vh;
  }

  #viewer.visible {
    display: flex;
  }

  .viewer-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .viewer-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .viewer-title .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .lock-btn {
    font-family:  monospace;
    font-size: 0.65rem;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 0.3rem 0.75rem;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .lock-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  #pdfEmbed {
    flex: 1;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

<!-- ===== LOCK SCREEN ===== -->
<div id="lockScreen">
  <div class="card">
    <div class="header">
      <div class="tag">Protected content</div>
      <h1>Enter <span style="color: var(--surimiOrange)">PIN</span></h1>
    </div>

    <div class="pin-inputs" id="pinRow">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
      <input type="password" inputmode="numeric" maxlength="1" placeholder="·">
    </div>
    <button class="btn" id="unlockBtn" disabled>Decrypt</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="loading-msg" id="loadingMsg"></div>
  </div>
</div>

<!-- ===== PDF VIEWER ===== -->
<div id="viewer">
  <div class="viewer-bar">
    <div class="viewer-title">
      <span class="dot"></span>
      <span id="viewerFilename">PDF Viewer</span>
    </div>
    <button class="lock-btn" id="lockBtn">Lock</button>
  </div>
  <iframe id="pdfEmbed" title="PDF Viewer"></iframe>
</div>

<script>
  // =============================================
  // KONFIGURATION — hier Dateinamen anpassen!
  // =============================================
  const ENCRYPTED_FILE = 'presentation.enc'; // <-- Dateiname deiner .enc Datei
  // =============================================

  const pinInputs = document.querySelectorAll('#pinRow input');
  const unlockBtn = document.getElementById('unlockBtn');
  const errorMsg = document.getElementById('errorMsg');
  const loadingMsg = document.getElementById('loadingMsg');

  // PIN input handling
  pinInputs.forEach((input, i) => {
    input.addEventListener('input', () => {
      const val = input.value.replace(/[^0-9]/g, '');
      input.value = val.slice(-1);
      if (val && i < pinInputs.length - 1) pinInputs[i + 1].focus();
      unlockBtn.disabled = getPin().length !== 6;
      errorMsg.textContent = '';
    });    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && i > 0) {
        pinInputs[i - 1].focus();
      }
      if (e.key === 'Enter' && getPin().length === 6) {
        unlockBtn.click();
      }
    });
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasted = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
      [...pasted].forEach((ch, j) => { if (pinInputs[j]) pinInputs[j].value = ch; });
      unlockBtn.disabled = getPin().length !== 6;
    });
  });

  function getPin() {
    return [...pinInputs].map(i => i.value).join('');
  }

  function clearPin() {
    pinInputs.forEach(i => i.value = '');
    pinInputs[0].focus();
    unlockBtn.disabled = true;
  }

  function shakePin() {
    const row = document.getElementById('pinRow');
    row.classList.add('shake');
    row.addEventListener('animationend', () => row.classList.remove('shake'), { once: true });
  }

  // Auto-focus first input
  pinInputs[0].focus();

  // Unlock
  unlockBtn.addEventListener('click', async () => {
    const pin = getPin();
    unlockBtn.disabled = true;
    errorMsg.textContent = '';
    loadingMsg.textContent = 'Load file...';

    try {
      // Fetch encrypted file
      const response = await fetch(ENCRYPTED_FILE);
      if (!response.ok) throw new Error('File not found: ' + ENCRYPTED_FILE);

      loadingMsg.textContent = 'Decrypt...';
      const fileData = new Uint8Array(await response.arrayBuffer());

      // Parse format: "ENCPDF" (6) + salt (16) + iv (12) + ciphertext
      const magic = String.fromCharCode(...fileData.slice(0, 6));
      if (magic !== 'ENCPDF') throw new Error('Invalid file format');

      const salt = fileData.slice(6, 22);
      const iv = fileData.slice(22, 34);
      const ciphertext = fileData.slice(34);

      // Derive key
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      // Decrypt
      let decrypted;
      try {
        decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
      } catch {
        throw new Error('WRONG_PIN');
      }

      loadingMsg.textContent = 'Open PDF...';

      // Show PDF
      const blob = new Blob([decrypted], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      document.getElementById('pdfEmbed').src = url;
      document.getElementById('viewerFilename').textContent =
        ENCRYPTED_FILE.replace('.enc', '.pdf');

      document.getElementById('lockScreen').classList.add('hidden');
      document.getElementById('viewer').classList.add('visible');
      loadingMsg.textContent = '';

    } catch (err) {
      loadingMsg.textContent = '';
      if (err.message === 'WRONG_PIN') {
        errorMsg.textContent = '✗ Falscher PIN';
      } else {
        errorMsg.textContent = '✗ ' + err.message;
      }
      shakePin();
      clearPin();
    }
  });

  // Lock button
  document.getElementById('lockBtn').addEventListener('click', () => {
    document.getElementById('pdfEmbed').src = '';
    document.getElementById('lockScreen').classList.remove('hidden');
    document.getElementById('viewer').classList.remove('visible');
    clearPin();
  });
</script>
</body>
</html>
