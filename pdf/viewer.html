<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypt</title>
<style>
  :root {
      --sumiInk-1b: #181820;
      --sumiInk-3: #363646;
      --fujiWhite: #DCD7BA;
      --samuraiRed: #E82424;
      --peachRed: #FF5D62;
      --springGreen: #98BB6C;
      --springViolet2: #9CABCA;
      --surimiOrange: #FFA066;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
      font-family: monospace;
      font-size: 1.2rem;
      background-color: var(--sumiInk-1b);
      color: var(--fujiWhite);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
  }

  h1 { font-size: 1.5em; margin-bottom: 1rem; color: var(--peachRed); }

  @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
  }

  .card { padding: 2rem; }

  .tag {
      font-size: 0.7rem;
      color: var(--springViolet2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
  }

  .password-input {
      width: 50%;
      padding: 0.6rem;
      background: var(--sumiInk-3);
      border-color: #D27E99;
      color: var(--fujiWhite);
      outline: none;
      font-size: 1rem;
  }

  .password-input.shake { animation: shake 0.4s ease; }

  .btn {
      width: 100%;
      padding: 1rem;
      background: var(--sumiInk-3);
      border: none;
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 1.5rem;
  }

  .btn:hover { background: var(--surimiOrange); }

  .status { font-size: 0.75rem; margin-top: 0.75rem; min-height: 1.2rem; }
  .status.success { color: var(--springGreen); }
  .status.error { color: var(--samuraiRed); }
</style>
<script src="https://cdn.jsdelivr.net/npm/argon2-browser/dist/argon2-bundled.min.js"></script>
<script>
  const B64 = "";
  const passwordInputs = document.getElementById('passwordInput');
  const unlockBtn = document.getElementById('unlockBtn');
  const errorMsg = document.getElementById('errorMsg');
  const loadingMsg = document.getElementById('loadingMsg');

  passwordInputs.focus();

  function shakePassword() {
      passwordInputs.classList.add('shake');
      passwordInputs.addEventListener('animationend', () => passwordInputs.classList.remove('shake'), { once: true });
  }

  const b2u = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

  async function deriveKey(password, salt) {
      const result = await argon2.hash({
          pass: password, salt,
          type: argon2.ArgonType.Argon2id,
          hashLen: 32, time: 3, mem: 65536, parallelism: 1});
      return crypto.subtle.importKey("raw", result.hash, { name: "AES-GCM" }, false, ["decrypt"]);
  }

  unlockBtn.addEventListener('click', async () => {
      errorMsg.textContent = '';
      loadingMsg.textContent = 'Decrypt...';
      try {
	  const fileData = b2u(B64);
	  if (String.fromCharCode(...fileData.slice(0, 6)) !== 'ENCPDF') throw new Error('Invalid file');
	  const key = await deriveKey(passwordInputs.value, fileData.slice(6, 22));
	  let decrypted;
	  try {
              decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fileData.slice(22, 34) }, key, fileData.slice(34));
          } catch {
              throw new Error('WRONG');
          }
	  loadingMsg.textContent = 'Open PDF...';
	  const url = URL.createObjectURL(new Blob([decrypted], { type: 'application/pdf' }));
          window.open(url);
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          loadingMsg.textContent = '';
      } catch (err) {
	  loadingMsg.textContent = '';
	  errorMsg.textContent = err.message === "WRONG"?"✗ Wrong PASSWORD":'✗ ' + err.message;
	  errorMsg.className = 'status error';
	  shakePassword();
	  passwordInputs.value = '';
          passwordInputs.focus();
      }
  });
</script>
</head>
<body>
<div id="lockScreen">
  <div class="card">
    <div class="header">
      <div class="tag">Protected content</div>
      <h1>Enter <span style="color: var(--surimiOrange)">Password</span></h1>
    </div>
    <input
      id="passwordInput"
      class="password-input"
      type="password"
      placeholder="Password"
      >
    <button class="btn" id="unlockBtn">Decrypt</button>
    <div class="status" id="errorMsg"></div>
    <div class="loading-msg" id="loadingMsg"></div>
  </div>
</div>
</body>
</html>
